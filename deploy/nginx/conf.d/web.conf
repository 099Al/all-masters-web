server {
    listen 80;
    server_name _;

    # Чтобы не было ситуации "HTML новый, JS старый"
    location / {
        proxy_pass http://all-masters-web:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HTML лучше кешировать
        add_header Cache-Control "no-store" always;
    }

    # Если статика по /static/*
    location /static/ {
        proxy_pass http://all-masters-web:8000/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Если WebApp открывается внутри Telegram (iframe)
    add_header Content-Security-Policy "frame-ancestors https://web.telegram.org https://*.telegram.org;" always;
}
